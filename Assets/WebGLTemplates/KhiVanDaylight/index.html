<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Khí Vận Chi Tử">
    <title>Khí Vận Chi Tử — Bản Thương Mại</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
      :root {
        --jade-bg-top: #cbeeff;
        --jade-bg-bot: #eef7ea;
        --jade-card: rgba(249, 246, 236, 0.94);
        --jade-ink: #1f2b29;
        --jade-accent: #22886f;
        --jade-gold: #c99732;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, var(--jade-bg-top) 0%, var(--jade-bg-bot) 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #unity-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        background: linear-gradient(180deg, #98dcff 0%, #c8f0be 100%);
      }
      #unity-loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(circle at 50% 25%, #ffffff 0%, #dcf2ff 45%, #e8f5df 100%);
        z-index: 20;
        transition: opacity 0.25s ease;
      }
      .loader-card {
        width: min(360px, 90vw);
        background: var(--jade-card);
        border: 2px solid rgba(201, 151, 50, 0.55);
        border-radius: 20px;
        padding: 22px 20px;
        box-shadow: 0 12px 32px rgba(34, 80, 62, 0.14);
        text-align: center;
      }
      .loader-title {
        font-size: 22px;
        font-weight: 800;
        color: var(--jade-ink);
        letter-spacing: 0.4px;
      }
      .loader-sub {
        margin-top: 6px;
        font-size: 13px;
        color: #4f6460;
      }
      .progress-track {
        margin-top: 16px;
        width: 100%;
        height: 12px;
        border-radius: 999px;
        background: #e1eadc;
        overflow: hidden;
        border: 1px solid rgba(34, 136, 111, 0.25);
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #22886f, #55b98e, #d4a139);
        transition: width 0.12s linear;
      }
      #unity-progress-label {
        margin-top: 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--jade-accent);
      }
      #kv-input-modal {
        position: fixed;
        inset: 0;
        background: rgba(25, 38, 35, 0.42);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding-top: max(48px, env(safe-area-inset-top));
        z-index: 40;
      }
      .kv-input-box {
        width: min(380px, 92vw);
        background: #faf7ef;
        border: 2px solid var(--jade-gold);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 14px 34px rgba(0,0,0,0.22);
      }
      .kv-input-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--jade-ink);
        margin-bottom: 10px;
      }
      #kv-native-input {
        width: 100%;
        font-size: 16px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1.5px solid #22886f;
        background: #ffffff;
        color: #16201f;
        outline: none;
        user-select: text;
        -webkit-user-select: text;
      }
      .kv-input-actions {
        margin-top: 12px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .kv-btn {
        border: none;
        border-radius: 10px;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .kv-btn-cancel { background: #dfe7e2; color: #364744; }
      .kv-btn-ok { background: linear-gradient(135deg, #249276, #1b725b); color: #ffffff; }
      #unity-warning {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        display: none;
        max-width: 90vw;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <div id="unity-loading-overlay">
      <div class="loader-card">
        <div class="loader-title">KHÍ VẬN CHI TỬ</div>
        <div class="loader-sub">Đang khởi tạo Đồng Cỏ Thanh Vân...</div>
        <div class="progress-track">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-progress-label">0%</div>
      </div>
    </div>

    <div id="kv-input-modal" role="dialog" aria-modal="true">
      <div class="kv-input-box">
        <div class="kv-input-title" id="kv-input-title">Nhập Đạo Hiệu</div>
        <input id="kv-native-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" />
        <div class="kv-input-actions">
          <button type="button" class="kv-btn kv-btn-cancel" id="kv-btn-cancel">Hủy</button>
          <button type="button" class="kv-btn kv-btn-ok" id="kv-btn-ok">Xác nhận</button>
        </div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingOverlay = document.querySelector("#unity-loading-overlay");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var progressLabel = document.querySelector("#unity-progress-label");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.textContent = msg;
        div.style.padding = "8px 14px";
        div.style.borderRadius = "10px";
        div.style.marginBottom = "6px";
        div.style.fontSize = "13px";
        div.style.fontWeight = "600";
        div.style.background = type === "error" ? "#d94136" : "#fff2cc";
        div.style.color = type === "error" ? "#fff" : "#3a2d0a";
        warningBanner.appendChild(div);
        if (type !== "error") {
          setTimeout(function () {
            if (div.parentNode === warningBanner) warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 4500);
        }
        updateBannerVisibility();
      }

      // iOS Safari native Vietnamese Telex / input dialog bridge
      (function () {
        var modal = document.getElementById("kv-input-modal");
        var titleEl = document.getElementById("kv-input-title");
        var inputEl = document.getElementById("kv-native-input");
        var okBtn = document.getElementById("kv-btn-ok");
        var cancelBtn = document.getElementById("kv-btn-cancel");
        var pending = null;

        function closeModal(commit) {
          modal.style.display = "none";
          if (commit && pending && window.unityInstance) {
            window.unityInstance.SendMessage(pending.go, pending.method, inputEl.value || "");
          }
          pending = null;
          canvas.focus();
        }

        okBtn.addEventListener("click", function () { closeModal(true); });
        cancelBtn.addEventListener("click", function () { closeModal(false); });
        inputEl.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); closeModal(true); }
          if (e.key === "Escape") { e.preventDefault(); closeModal(false); }
        });

        window.KhiVanWebBridge = {
          openInput: function (go, method, title, initialValue, maxLength) {
            pending = { go: go, method: method };
            titleEl.textContent = title || "Nhập nội dung";
            inputEl.value = initialValue || "";
            if (maxLength && maxLength > 0) inputEl.maxLength = maxLength;
            else inputEl.removeAttribute("maxLength");
            modal.style.display = "flex";
            setTimeout(function () { inputEl.focus(); inputEl.select(); }, 30);
          }
        };

        // Unlock WebAudio cleanly on iPhone Safari touch + tab return
        var unlockAudio = function () {
          try {
            if (window.WEBAudio && window.WEBAudio.audioContext && window.WEBAudio.audioContext.state === "suspended") {
              window.WEBAudio.audioContext.resume();
            }
          } catch (e) {}
        };
        window.addEventListener("touchstart", unlockAudio, { passive: true });
        window.addEventListener("touchend", unlockAudio, { passive: true });
        window.addEventListener("pointerup", unlockAudio, { passive: true });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") setTimeout(unlockAudio, 120);
        });

        // Restoring a WebGL context does not rebuild Unity's GPU resources.
        var graphicsRecovery = null;
        var reloadAfterGraphicsRestore = function () {
          if (!graphicsRecovery || !graphicsRecovery.restored || graphicsRecovery.reloading || document.hidden) return;
          graphicsRecovery.reloading = true;
          graphicsRecovery.saved.then(function (saved) {
            if (!saved || document.hidden) {
              graphicsRecovery.reloading = false;
              graphicsRecovery.message.textContent = saved
                ? "Đồ họa đã sẵn sàng. Đang chờ mở lại trang..."
                : "Chưa xác nhận được bản lưu mới nhất. Bạn có thể tải lại để tiếp tục từ bản lưu trước.";
              return;
            }
            var key = "khivan-graphics-reload-at:" + location.pathname;
            try {
              var lastReload = Number(sessionStorage.getItem(key) || 0);
              if (Date.now() - lastReload < 30000) {
                graphicsRecovery.message.textContent = "Đồ họa bị gián đoạn nhiều lần. Hãy tải lại trang để tiếp tục.";
                return;
              }
              sessionStorage.setItem(key, String(Date.now()));
            } catch (_) {
              return;
            }
            graphicsRecovery.message.textContent = "Đã lưu tiến trình. Đang mở lại trò chơi...";
            location.reload();
          });
        };
        canvas.addEventListener("webglcontextlost", function (e) {
          e.preventDefault();
          if (graphicsRecovery) return;
          var box = document.createElement("div");
          box.style.cssText = "padding:8px 14px;border-radius:10px;background:#d94136;color:#fff;font-size:13px;";
          var message = document.createElement("div");
          message.textContent = "Đồ họa bị gián đoạn. Đang lưu tiến trình và chờ khôi phục...";
          var reload = document.createElement("button");
          reload.type = "button";
          reload.textContent = "Tải lại trò chơi";
          reload.style.cssText = "margin-top:6px;pointer-events:auto;";
          reload.onclick = function () {
            reload.disabled = true;
            graphicsRecovery.saved.then(function () { location.reload(); });
          };
          box.appendChild(message);
          box.appendChild(reload);
          warningBanner.appendChild(box);
          warningBanner.style.display = "block";
          var checkpoint = window.KhiVanSaveBeforeGraphicsReload
            ? window.KhiVanSaveBeforeGraphicsReload()
            : Promise.resolve(false);
          graphicsRecovery = {
            message: message,
            restored: false,
            reloading: false,
            saved: Promise.race([
              checkpoint.catch(function () { return false; }),
              new Promise(function (resolve) { setTimeout(function () { resolve(false); }, 3000); })
            ])
          };
        }, false);
        canvas.addEventListener("webglcontextrestored", function () {
          if (!graphicsRecovery) return;
          graphicsRecovery.restored = true;
          reloadAfterGraphicsRestore();
        }, false);
        document.addEventListener("visibilitychange", reloadAfterGraphicsRestore);

        // Keep canvas flush with Safari dynamic address bar / Android viewport resize
        if (window.visualViewport) {
          var resizeTimer = null;
          var syncViewport = function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
              var c = document.getElementById("unity-container");
              if (c) c.style.height = window.visualViewport.height + "px";
            }, 80);
          };
          window.visualViewport.addEventListener("resize", syncViewport);
          syncViewport();
        }
      })();

      var isMobileBrowser = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || "");
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // Cap DPR to 1.5 on iPhone/Android (cuts mobile pixel fill by ~44% & prevents Safari VRAM pressure)
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, isMobileBrowser ? 1.5 : 2),
        webglContextAttributes: {
          preserveDrawingBuffer: false,
          powerPreference: isMobileBrowser ? "default" : "high-performance"
        },
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var pct = Math.round(progress * 100);
          progressBarFull.style.width = pct + "%";
          progressLabel.textContent = pct + "%";
        }).then(function (unityInstance) {
          window.unityInstance = unityInstance;
          loadingOverlay.style.opacity = "0";
          setTimeout(function () { loadingOverlay.style.display = "none"; }, 260);
        }).catch(function (message) {
          progressLabel.textContent = "Lỗi tải: " + message;
          progressLabel.style.color = "#c94132";
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
